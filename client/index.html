<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevDebugger AI — Autonomous Code Debugging Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eff6ff',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8'
              },
              dark: {
                800: '#1e222b',
                850: '#171a21',
                900: '#0f1117',
                950: '#090a0f'
              }
            },
            fontFamily: {
              mono: ['JetBrains Mono', 'Fira Code', 'monospace']
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
      pre, code {
        font-family: 'JetBrains Mono', monospace;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0f1117;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a2f3d;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3b4254;
      }
    </style>
  </head>
  <body class="bg-dark-950 text-slate-100 min-h-screen antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
